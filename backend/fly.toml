app = "chordlyze-api"
primary_region = "fra"

[build]

[mounts]
  source = "chordlyze_cache"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  # Ten-minute rich inference exceeds 2 GB without swap (capacity regression).
  memory = "4gb"
