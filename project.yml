name: Chordlyze
options:
  bundleIdPrefix: com.ilieberacha
  deploymentTarget:
    iOS: "17.0"
targets:
  Chordlyze:
    type: application
    platform: iOS
    sources: [Chordlyze]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilieberacha.chordlyze
        DEVELOPMENT_TEAM: A9PUX87DMD
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chordlyze
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    info:
      path: Chordlyze/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [chordlyze]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Chordlyze listens to songs and your playing to recognize chords and score practice.
        UIBackgroundModes: [audio]
